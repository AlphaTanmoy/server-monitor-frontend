<div class="p-6">


    <div class="flex gap-3">

        <input
            type="password"
            placeholder="Enter API Key"
            class="border rounded-lg px-4 py-2 w-96"
            [value]="apiKey()"
            (input)="apiKey.set($any($event.target).value)"
        />


        <button
            class="bg-black text-white px-5 py-2 rounded-lg"
            (click)="checkStatus()"
        >
            Check Status
        </button>


    </div>


    <p class="mt-5 text-xl font-semibold">
        {{ status() }}
    </p>


    <div class="grid grid-cols-1 md:grid-cols-3 gap-6 mt-8">


        @for(service of monitors(); track service.name) {

            <div class="border rounded-xl p-5">

                <div class="flex justify-between">

                    <h2 class="font-bold">
                        {{service.name}}
                    </h2>


                    @if(service.healthy) {

                        <span class="text-green-600">
                            UP
                        </span>

                    } @else {

                        <span class="text-red-600">
                            DOWN
                        </span>

                    }

                </div>


                <p class="mt-3">
                    {{service.message}}
                </p>


                <p>
                    {{service.responseTime}} ms
                </p>


            </div>

        }


    </div>


</div>
